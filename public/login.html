<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="hdr"></header>

    <div class="box" style="width:400px">
        <h2>LOGIN</h2>
        <form onsubmit="return doLogin(event)">
            <div class="grid2">
                <input class="full" id="lu" type="text" placeholder="Username" required>
                <input class="full" id="lp" type="password" placeholder="Password" required>
            </div>
            <div class="error" id="err"></div>
            <div class="center"><button type="submit">Login</button></div>
        </form>
    </div>

    <script src="app.js"></script>
    <script>
        showNav();
        checkLogin();

        // already logged in? go to your own page
        async function checkLogin(){
            let me = await currentUser();
            if(me != null){
                window.location.href = homeFor(me.role);
            }
        }

        async function doLogin(e){
            e.preventDefault();
            let u = document.getElementById("lu").value;
            let p = document.getElementById("lp").value;

            let data = await api("/api/login", "POST", { username:u, password:p });

            if(!data.ok){
                document.getElementById("err").innerHTML = "Wrong username or password";
                return false;
            }
            window.location.href = homeFor(data.role);
            return false;
        }
    </script>
</body>
</html>
