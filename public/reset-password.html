<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — FoodLink</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="hdr"></header>

    <div class="box" style="max-width:420px; margin:60px auto;">
        <h2 style="margin-bottom:6px;">RESET PASSWORD</h2>
        <p style="color:#64748b; font-size:14px; margin-bottom:24px; text-align:center;">Enter a new password for your account.</p>

        <div id="invalid-state" style="display:none; text-align:center;">
            <p style="color:#dc2626; font-weight:600;">This reset link is invalid or has expired.</p>
            <p style="font-size:14px; color:#64748b;">Please <a href="login.html" style="color:#16a34a; font-weight:600;">request a new one</a>.</p>
        </div>

        <form id="reset-form" onsubmit="return doReset(event)">
            <input class="full" id="pw" type="password" placeholder="New password (min 6 characters)" required minlength="6" autocomplete="new-password">
            <input class="full" id="pw2" type="password" placeholder="Confirm new password" required minlength="6" autocomplete="new-password" style="margin-top:10px;">
            <div class="error" id="err" style="margin-top:8px;"></div>
            <div class="center" style="margin-top:16px;">
                <button type="submit" id="submit-btn">Set New Password</button>
            </div>
        </form>

        <div id="success-state" style="display:none; text-align:center;">
            <p style="color:#15803d; font-weight:600; font-size:16px;">Password updated successfully!</p>
            <p style="font-size:14px; color:#64748b;">Redirecting to login...</p>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        if (!token) {
            document.getElementById("reset-form").style.display = "none";
            document.getElementById("invalid-state").style.display = "block";
        }

        async function doReset(e) {
            e.preventDefault();
            const pw = document.getElementById("pw").value;
            const pw2 = document.getElementById("pw2").value;
            const errEl = document.getElementById("err");
            errEl.textContent = "";

            if (pw !== pw2) {
                errEl.textContent = "Passwords do not match.";
                return false;
            }

            const btn = document.getElementById("submit-btn");
            btn.disabled = true;
            btn.textContent = "Updating...";

            const data = await api("/api/reset-password", "POST", { token, password: pw });

            if (!data.ok) {
                errEl.textContent = data.error || "Could not reset password. The link may have expired.";
                btn.disabled = false;
                btn.textContent = "Set New Password";
                return false;
            }

            document.getElementById("reset-form").style.display = "none";
            document.getElementById("success-state").style.display = "block";
            setTimeout(() => { window.location.href = "login.html"; }, 2000);
            return false;
        }
    </script>
</body>
</html>
